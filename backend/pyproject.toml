[project]
name = "shaverma-adminka-backend"
version = "0.1.0"
description = "Shaverma Adminka control-plane backend (foundation stage: auth + audit only, no system actions)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymysql>=1.1",
    "alembic>=1.13",
    "pwdlib[argon2]>=0.2",
    "httpx>=0.27",
    "socksio>=1.0",
    "idna>=3.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
